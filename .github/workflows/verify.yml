name: Verify portfolio

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm the exact revision under test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          echo "Testing exact revision: $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Upload browser report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-verification
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      # Keep independently downloadable evidence below the transfer size limit.
      - name: Upload desktop screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-desktop-screenshots
          path: |
            test-results/*-desktop/**/*.png
            !test-results/personal-photos-*/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload mobile screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-mobile-screenshots
          path: |
            test-results/*-mobile/**/*.png
            !test-results/personal-photos-*/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload personal photo screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-personal-photo-screenshots
          path: test-results/personal-photos-*/**/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure context
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-failure-context
          path: test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14
