name: Verify portfolio

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Upload browser traces, screenshots, and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-verification
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
